name: backup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PG_IMAGE: postgres:17
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Backup
        id: backup
        env:
          BACKUP_POSTGRES_URL: ${{ secrets.BACKUP_POSTGRES_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/backup/backup.sh
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: backup-out/*.tar.age
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
