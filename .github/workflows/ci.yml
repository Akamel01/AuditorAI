name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  state:
    name: shared-state validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate-state.mjs

  evidence:
    name: evidence registry determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/compile-evidence.mjs
      - name: fail if committed registry differs from compiled output
        run: git diff --exit-code -- state/evidence-registry.json

  vault:
    name: vault compile determinism (V2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: export registries -> views; import chartered front-matter -> JSON
        run: |
          node scripts/vault-export.mjs
          node scripts/vault-import.mjs
      - name: fail if committed vault views/notes differ from compiled output
        run: git diff --exit-code -- vault/views state/vault-notes.json

  eval-gate:
    name: eval gate freshness (R13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-eval-gate-freshness.mjs

  quality:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: browser e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
